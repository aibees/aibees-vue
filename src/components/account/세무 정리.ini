세무 정리
부가세 -> 간접세 ( 납세자 <> 담세자) aka 부가가치세
소득세 -> 직접세 ( 납세자 == 담세자) aka 원천세

소득이 있는 곳에 세금이 있다.

대변의 부가세예수금, 차변의 부가세대급금 모두 반제처리하여 상계, 환급은 미수금, 납세는 미지급금으로 차액이 떨어짐.


세무일자 기준
1기 예정은 04.25 / 01.01 ~ 03. 31
1기 확정은 07. 25 + 예정신고 누락 분

2기 예정은 10. 25
2기 확정은 01. 25

부가세 신고서도 종류가 있다.
일반과세자 부가세신고
매출세금계산서 합계서
매입세금계산서 합계서

이걸 네온에서 자동으로 홈택스 업로드 파일 생성, 신고전표까지 생성.


부가세신고 2주 전부터 부가세신고 사전점검(BTX012) 수행
공통조회관리에서 배치 관리
메일을 시작할 때 처음 한 번 전체 대상으로 전송(안내메일)

taxation_cd == 5 -> 사업자단위 과세
ma_organization.vat_flag => 부가세 신고 대상 사업장 여부

