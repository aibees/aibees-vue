매출전표 생성 -> 부가세 관련계정

보조부를 만들고 승인한 매출부가세 전표는 매출세금계산서 확정에서 조회 가능

매출세금계산서확정
- 개별
- 합계 : 하나의 세금계산서, 하나의 품목
- 다품목합계 : 하나의 세금계산서, 여러 개 품목
- 자동합계 : 빌링 등 전표인터페이스 중에 부가세 보조부 입력란 존재 -> 그룹합계ID 로 자동합계할 수 있도록.

매출세금계산서발행
- 발행방법
    - nTax
    - 타사이트발행(홈택스, 타사 역발행, 세금서비스 3rd)
    - 미교부 : 주민번호 불확실(해외수출), 그 외 세금계산서 발행정보가 불충분. 매출은 발생되었다는 증거로 남김
    - invoice : 해외법인 대상으로
    - invoice_fcr

발행 다음으로 부가세데이터 관리
    -> 마감(부가세마감)
    -> 신고자료 작성
    -> 신고전표 생성

