[공제 / 불공제]

공제 - 업무와 관련된 지출일 때 세금에서 공제 대상이 된다.
불공제 - 업무와 관련없는 지출은 세금에서 불공제 대상이 된다.

[수정계산서 발행]
수정 계산서는 확정/ 발행없이 처리

수정발행 때 새 전표가 필요없는 건 기재사항 착오 정정

나머지 케이스는 전표가 필요.
전표를 먼저 만들어놓고, 수정발행 절차를 밟아야 한다. -> 수정용 전표 만들어놓고 확정/발행 처리하면 안됨. -> 이렇게 하면 개별 계산서 처리가 된다.

필요적 기재사항은 반드시 지켜야 하기 때문에 운영업무 상 참고로 알고있으면 좋다.


