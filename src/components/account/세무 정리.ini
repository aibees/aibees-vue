원천세(소득세)
소득세
- 근로, 사업, 기타, 퇴직소득

과세표준 -> 소득 세액률을 정하는 기준 금액

소득세는 소득을 지급하는 대상이 처리하도록 하는게 원칙

원천징수 이행신고.
- 매월 10일까지 이전 달분 납부

----------------
전표생성(예수금 포함)

-> 원천세 관리
    - 0. 미검토
    - 1. 검토
    - 2. 확정
    - 3. 전표
        - 원천징수이행신고 전표 (예수금 반제처리)
    - 4. 신고


[원천징수이행신고서]
1. 집계
- [전표] 상태의 원천세 집계

2. 전산매체생성
- 원천세 신고파일 생성(이행신고) -> 홈택스에 업로드

3. 신고마감
- 원천세관리에서 신고 상태로 상태변경
- 귀속년월 마감하면서 다음 귀속년월 OPEN

지급명세서 신고자료 생성
- 사업소득
- 기타소득
- 비거주자의 사업 기타소득
3가지만 NEON에서 생성처리.
    간이지급명세서는 익월 말일, (사업, 기타소득)
    년단위 지급명세서는 매년 2월 말일까지(위 3개 모두)

법인원천 -> 해외법인이랑 사용료소득이나 이자 등을 처리해야 할 때



